<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Thinker - Code Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d1117; /* Deep blue-tinted dark background */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
        }
        
        /* VS Code Style Catalog / Sidebar */
        #sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        #sidebar h2 {
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #8b949e;
            text-transform: uppercase;
        }
        #fileList {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            margin-top: 10px;
        }
        #fileList li {
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #8b949e;
            border-bottom: 1px solid #21262d;
        }
        #fileList li:hover {
            background: #21262d;
            color: #f0f6fc;
        }

        /* Workspace and Editor */
        #workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #0d1117;
        }
        
        #welcomeScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #58a6ff;
        }
        button {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }

        .secondary-btn {
            background: #21262d !important;
            color: #c9d1d9 !important;
            border: 1px solid #30363d !important;
        }
        .secondary-btn:hover {
            background: #30363d !important;
        }

        #editorContainer {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        #fileTitle {
            font-size: 13px;
            color: #8b949e;
        }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        
        /* Editor Rows Layout */
        .editor-rows {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 100%;
        }
        .editor-row {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        textarea {
            flex-grow: 1;
            background: #0d1117;
            color: #79c0ff; /* Bright blue-highlight text for the editor */
            border: none;
            padding: 20px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }
    </style>
</head>
<body>

    <!-- Catalog Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>The Thinker</h2>
        </div>
        <button id="openBtn">Open Folder</button>
        <ul id="fileList">
            <div style="color: #484f58; font-size: 12px; text-align: center; margin-top: 40px;">No folder opened</div>
        </ul>
    </div>

    <!-- Main Workspace -->
    <div id="workspace">
        <div id="welcomeScreen">
            <h1>THE THINKER</h1>
            <p style="color: #8b949e; font-size: 13px; margin-bottom: 15px;">Your personal local code catalog.</p>
            <button onclick="document.getElementById('openBtn').click()">Open Workspace</button>
        </div>

        <!-- Code Editor View -->
        <div id="editorContainer">
            <div class="top-bar">
                <span id="fileTitle">No file selected</span>
                <div class="action-btns">
                    <button class="secondary-btn" id="renameBtn">Rename</button>
                    <button id="saveBtn">Save</button>
                </div>
            </div>
            <div class="editor-rows">
                <div class="editor-row">
                    <textarea id="codeEditor" placeholder="Select a file from the catalog to start writing code..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const fileList = document.getElementById('fileList');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const editorContainer = document.getElementById('editorContainer');
        const fileTitle = document.getElementById('fileTitle');
        const codeEditor = document.getElementById('codeEditor');
        const saveBtn = document.getElementById('saveBtn');
        const renameBtn = document.getElementById('renameBtn');

        let currentDirectoryHandle = null;
        let currentFileHandle = null;

        openBtn.addEventListener('click', async () => {
            try {
                currentDirectoryHandle = await window.showDirectoryPicker();
                welcomeScreen.style.display = 'none';
                editorContainer.style.display = 'flex';
                loadFiles(currentDirectoryHandle);
            } catch (err) {
                console.log("Folder selection cancelled.");
            }
        });

        async function loadFiles(dirHandle) {
            fileList.innerHTML = '';
            for await (const entry of dirHandle.values()) {
                const li = document.createElement('li');
                li.textContent = entry.kind === 'directory' ? `📁 ${entry.name}` : `📄 ${entry.name}`;
                
                if (entry.kind === 'file') {
                    li.addEventListener('click', () => openFile(entry));
                }
                
                fileList.appendChild(li);
            }
        }

        async function openFile(fileHandle) {
            currentFileHandle = fileHandle;
            const file = await fileHandle.getFile();
            const text = await file.text();
            
            fileTitle.textContent = file.name;
            codeEditor.value = text;
        }

        saveBtn.addEventListener('click', async () => {
            if (!currentFileHandle) return;
            try {
                const writable = await currentFileHandle.createWritable();
                await writable.write(codeEditor.value);
                await writable.close();
                alert("Changes saved to local storage!");
            } catch (err) {
                alert("Save failed: " + err.message);
            }
        });

        renameBtn.addEventListener('click', async () => {
            if (!currentFileHandle || !currentDirectoryHandle) return;
            const newName = prompt("New file name:", currentFileHandle.name);
            if (newName && newName !== currentFileHandle.name) {
                try {
                    await currentFileHandle.move(newName);
                    fileTitle.textContent = newName;
                    loadFiles(currentDirectoryHandle);
                } catch (err) {
                    alert("Rename failed: " + err.message);
                }
            }
        });
    </script>
</body>
  </html>
